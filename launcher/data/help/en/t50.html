<p style="margin-top:0px;margin-bottom:0px"><span style="font-family:'Arial';font-size:8pt;font-weight:normal">The control rate determines the frequency of data exchange during network games. A lower control rate guarantees smoothest game flow (recommended for local area networks). A higher control rate reduces data transmission amounts but causes less exact game flow (recommended for internet games).</span></p>
