; Default settings. On the first start they are copied to the user's clonk.ini
; (~/.config/clonk-planet on Linux, %APPDATA%\Clonk Planet on Windows,
; ~/Library/Application Support/Clonk Planet on macOS), which is used from then on.
; Everything not listed here uses the engine defaults (engine/src/C4Config.cpp).

[General]
Language=US

[Controls]
; Z instead of Y on the bottom row of keyboard 1 (QWERTY layout)
Kbd1Key7=90
